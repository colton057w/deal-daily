/* Standalone 1080p scenes: intrinsic 16:9 sizing, no atlas crops or stretching. */
.scene-art,.scene-banner{width:100%;height:auto;aspect-ratio:16/9;max-height:none;background:none;position:relative;overflow:hidden}
.scene-art:before{content:none}.scene-art:after{content:none}
.scene-image{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;image-rendering:auto}
.scene-thumbnail{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.thumb,.destination .thumb{height:auto;aspect-ratio:16/9;background:#0d1826;overflow:hidden}
.tiny-art{width:64px;height:36px;aspect-ratio:16/9;background:#0d1826;border:0}
.scene-banner{margin-bottom:18px;border-radius:4px}
.scene-caption{bottom:12px;max-width:calc(100% - 24px);font-size:11px}
.scene-label span:last-child{font-size:9px;letter-spacing:.7px}
.scene-props{max-width:80%}
.scene-card:has(.work-controls){display:flex;flex-direction:column}
.scene-card:has(.work-controls)>.scene-label{order:0}
.scene-card:has(.work-controls)>.work-controls{order:1;padding:10px 14px;background:#172739;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.scene-card:has(.work-controls)>.scene-art{order:2}
.scene-card:has(.work-controls)>.scene-footer{order:3}
.scene-card:has(.work-controls)>div:not([class]){order:4}
.scene-card:has(.work-controls)>.work-detail{order:5}
@media(max-width:650px){.scene-art,.scene-banner{height:auto;aspect-ratio:16/9}.scene-image{height:auto;aspect-ratio:16/9}.scene-label span:last-child{display:none}.scene-caption{font-size:9px;bottom:8px;left:8px;max-width:calc(100% - 16px)}.scene-props{top:8px;right:8px}.tiny-art{width:56px;height:31.5px}.work-controls .btn.big{font-size:12px}.content{padding-top:18px}.scene-card:has(.work-controls)>.work-controls{padding:9px;gap:7px}}
.market-chart{min-width:0;margin:4px 0 8px}.market-chart .chart{width:100%;height:96px;margin:3px 0 5px;display:block;overflow:visible}.chart-grid{fill:none;stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}.chart-axis{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font:11px var(--mono)}.chart-period{margin-top:5px;font-size:10px;color:var(--muted)}

/* City: one scene and a quiet destination directory. */
.city-page{max-width:1300px;margin:0 auto}
.city-page .chapter{display:none}
.city-page .page-head{margin-bottom:30px}
.city-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;align-items:start}
.city-view{margin:0;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:5px;background:#102031}
.city-view figcaption{display:flex;justify-content:space-between;gap:15px;padding:16px 18px;color:var(--muted);font-size:11px}
.city-view figcaption span:first-child{font:10px var(--mono);letter-spacing:1.5px;color:var(--gold);white-space:nowrap}
.city-directory{min-width:0;padding:4px 0}
.city-directory>h2{font-size:20px;margin-bottom:22px}
.city-district+ .city-district{margin-top:25px}
.city-district>h3{font:10px var(--mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.city-place{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:68px;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;border-radius:2px}
.city-place strong{display:block;font-size:13px;font-weight:600}
.city-place small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.city-place>span:last-child{color:var(--gold);font-size:18px;transition:transform .15s}
.city-place:hover{background:#1b3040}
.city-place:hover>span:last-child{transform:translate(2px,-2px)}
@media(max-width:1150px){.city-layout{grid-template-columns:minmax(0,1fr) 225px;gap:22px}.city-view figcaption{flex-direction:column;gap:5px}}
@media(max-width:900px){.city-layout{grid-template-columns:1fr;gap:25px}.city-directory{display:grid;grid-template-columns:1fr 1fr;column-gap:26px}.city-directory>h2{grid-column:1/-1;margin-bottom:16px}.city-district+ .city-district{margin-top:0}}
@media(max-width:480px){.city-page .page-head{margin-bottom:20px}.city-directory{grid-template-columns:1fr}.city-district+ .city-district{margin-top:24px}.city-view figcaption{padding:13px}.city-place{min-height:65px}}

/* Casino round animation */
.casino-table .reel{position:relative;overflow:hidden;min-width:76px;height:80px;display:inline-grid;place-items:center}
.reel-tape{position:absolute;inset:0 0 auto;background:#f3e3c7;color:#522a36;display:flex;flex-direction:column;will-change:transform}
.reel-tape>span{display:grid;place-items:center;height:74px;flex-shrink:0}
.reel-landed{animation:reel-settle .2s ease-out}
@keyframes reel-settle{50%{transform:translateY(5px)}to{transform:translateY(0)}}
.roulette-stage{position:relative;width:240px;height:240px;margin:24px auto 28px}
.roulette-wheel{position:absolute;inset:0;border:7px solid #bba06b;border-radius:50%;box-shadow:0 0 0 4px #422e27,0 8px 20px #0005}
.wheel-number{position:absolute;left:50%;top:50%;height:50%;width:18px;text-align:center;color:#fff4d5;font:9px var(--mono);transform-origin:50% 0;transform:translateX(-50%) rotate(calc(var(--angle) + 180deg));padding-top:87px}
.wheel-hub{position:absolute;inset:27%;border:5px solid #c3a268;background:#173f38;border-radius:50%;display:grid;place-items:center;font:bold 32px var(--mono);color:#ffe1a1;box-shadow:0 0 0 4px #15362e}
.ball-orbit{position:absolute;inset:12px;pointer-events:none}
.ball-orbit i{position:absolute;top:0;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#fff6db;box-shadow:0 2px 4px #0009}
.round-animating .wheel-hub{color:transparent}
@media(prefers-reduced-motion:reduce){.reel-landed{animation:none}}

/* A personal home, a growing collection, and room to customize. */
.life-page{max-width:1320px;margin:auto}.life-page .chapter{display:none}

.life-stats small{display:block;color:var(--muted);font:10px var(--mono);letter-spacing:1px;margin-bottom:6px}.life-stats strong{font-size:16px;color:var(--gold)}
.life-tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:0 0 28px;overflow-x:auto}
.life-tabs button{padding:13px 19px;border:0;border-bottom:3px solid transparent;white-space:nowrap;background:transparent;color:var(--muted)}.life-tabs button[aria-pressed=true]{border-color:var(--mint);color:var(--mint)}.life-tabs button:hover{background:var(--panel)}
.life-overview{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}.life-overview>div{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
.life-home-caption{padding:22px;display:flex;gap:20px;align-items:center;justify-content:space-between}.life-home-caption h2{margin:5px 0}.life-home-caption p,.life-section-intro p{font-size:12px;color:var(--muted)}
.life-section-intro{margin-bottom:23px;max-width:780px}.life-section-intro h2{font-size:23px;margin-bottom:8px}.life-catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.life-catalog .card{padding:18px;gap:12px}.life-catalog .card.owned{border-color:#5d877b}.life-art{width:100%;height:125px;display:block;border-radius:3px}.life-catalog .card .actions{margin-top:auto}.life-footnote{margin:22px 0;color:var(--muted);font-size:12px}
.room-preview{position:relative;min-height:275px;border:1px solid #677577;border-radius:5px;background:linear-gradient(#354851 0 58%,#867b67 58% 60%,#5b544a 60%);overflow:hidden;padding:120px 25px 22px}
.room-window{position:absolute;top:24px;right:10%;width:90px;height:85px;border:7px solid #beac8c;background:linear-gradient(#9eafc5,#e8c398);box-shadow:12px 12px 0 #24384266}.room-window:before{content:'';position:absolute;left:50%;height:100%;border-left:4px solid #beac8c}.room-window:after{content:'';position:absolute;top:50%;width:100%;border-top:4px solid #beac8c}
.room-name{position:absolute;top:28px;left:25px;color:#fff1d5;font:12px var(--mono);letter-spacing:1px}.room-pieces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;position:relative}.room-piece{min-width:0;text-align:center}.room-piece .life-art{height:105px}.room-piece small{display:block;background:#142936e8;color:#e1d7c5;font-size:10px;padding:7px 3px}.empty-piece{height:105px;display:grid;place-items:center;background:#182b3655;border:1px dashed #b8b5a888;color:#c4c8bf;font-size:25px}
@media(max-width:1050px){.life-catalog{grid-template-columns:repeat(2,minmax(0,1fr))}.life-overview{grid-template-columns:1fr}.life-home-caption{flex-wrap:wrap}}
@media(max-width:650px){.life-stats{gap:15px;flex-wrap:wrap}.life-stats strong{font-size:13px}.life-tabs button{padding:12px}.life-catalog{gap:12px}.life-catalog .card{padding:12px}.life-art{height:105px}.life-home-caption{padding:16px}.room-preview{padding:120px 12px 15px}.room-pieces{grid-template-columns:1fr 1fr;gap:10px}.room-name{left:15px}}
@media(max-width:380px){.life-catalog{grid-template-columns:1fr}}

.garage-feature{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:25px;padding:30px;border:1px solid #71827a;background:linear-gradient(120deg,#203b3e,#192d43);margin-bottom:26px;border-radius:5px}.garage-feature h2{font-size:27px;margin:8px 0}.garage-feature p{color:var(--muted);margin-bottom:16px}.garage-feature strong{color:var(--gold);font:13px var(--mono)}.garage-feature .life-art{height:200px}.room-remove{border:0;background:#203643;color:var(--mint);font-size:10px;padding:6px;width:100%}@media(max-width:650px){.garage-feature{grid-template-columns:1fr;padding:20px}.garage-feature .life-art{height:145px}}

.life-art{object-fit:contain;background:#112132;height:185px}.room-piece .life-art{height:120px}.garage-feature .life-art{height:240px}.life-overview .panel .life-art{height:155px}@media(max-width:650px){.life-art{height:140px}.room-piece .life-art{height:115px}.garage-feature .life-art{height:190px}}

@media(max-width:650px){.life-tabs{flex-wrap:wrap;overflow:visible;gap:3px}.life-tabs button{flex:1 0 28%;padding:11px 8px;font-size:12px}}

/* Your actual residence and daily driver share one exterior scene. */
.home-exterior{position:relative;aspect-ratio:16/11;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 35% 20%,#344653,#142634 65%);min-width:0}
.home-moon{position:absolute;top:9%;right:11%;width:28px;height:28px;background:#edce93;border-radius:50%;box-shadow:0 0 40px #e5bd6533}
.home-ground{position:absolute;bottom:11%;left:-8%;width:116%;height:35%;border-radius:50%;background:radial-gradient(ellipse,#425247,#273e3d 65%,#203839);transform:rotate(-7deg);box-shadow:0 12px 0 #152e32}
.home-drive{position:absolute;bottom:12%;right:-5%;width:59%;height:21%;background:repeating-linear-gradient(0deg,transparent 0 21px,#b1b6ab10 22px 23px),#536069;transform:skewY(-9deg);border-block:3px solid #8a8e7b}
.residence-building{position:absolute;left:1%;bottom:21%;width:85%;height:76%;object-fit:contain;filter:drop-shadow(0 10px 5px #0004)}
.parked-vehicle{position:absolute;right:6%;bottom:14%;width:36%;height:25%;object-fit:contain;filter:drop-shadow(0 6px 3px #0006)}.parked-bike{width:19%;right:12%;height:23%}
.exterior-caption{position:absolute;left:22px;bottom:17px;right:22px;display:flex;justify-content:space-between;gap:12px;color:#f1dfbb;font:11px var(--mono)}.exterior-caption small{color:#b4c5c8;font:10px var(--mono)}
.business-art{width:100%;height:190px;object-fit:contain;display:block;background:#142633;border-radius:3px}
@media(max-width:650px){.exterior-caption{left:12px;right:12px;bottom:12px;flex-direction:column;gap:4px;font-size:10px}.exterior-caption small{font-size:9px}.home-exterior{aspect-ratio:1.3}.home-moon{width:19px;height:19px}.business-art{height:140px}}

#scene[data-action="work"]{cursor:pointer;touch-action:manipulation;user-select:none}#scene[data-action="work"]:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}#scene[data-action="work"]:active>.scene-image{filter:brightness(1.08)}

 .parked-vehicle{height:30%;object-fit:contain;clip-path:none}.parked-bike{height:24%;clip-path:none}
.quick{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:2px 0 4px}.quick span{font:10px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-right:3px}.chip{min-height:26px;padding:3px 10px;border:1px solid #486071;background:#1d3043;border-radius:999px;color:var(--ink);font:bold 11px var(--font);line-height:1.3;cursor:pointer}.chip:hover{background:#2b4658;border-color:var(--mint)}.chip:active{background:var(--mint);color:#16342e}

.tray{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}.tray-item{border:1px solid #6b5a3a;background:#2a2620;color:#f0dcb0;font:bold 11px var(--font);padding:6px 10px;border-radius:3px;text-align:left;cursor:pointer}.tray-item.bad{border-color:#8a4a44;background:#301f1f;color:#f6b7ae}.tray-item:hover{filter:brightness(1.15)}
.lhc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.lhc-grid .panel{margin-top:0}.lhc-grid+.lhc-grid{margin-top:12px}
.meter{margin:8px 0}.meter .line{margin:0 0 2px}.warn-track i{background:var(--orange)}
.budget{width:100%;border-collapse:collapse;font-size:12px}.budget td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}.budget td.num{text-align:right;font-family:var(--mono);white-space:nowrap}
.spend-tiers{display:grid;gap:8px}.spend-tier{display:grid;gap:3px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--raised);border-radius:3px;color:var(--ink);cursor:pointer}.spend-tier small{font-family:var(--mono);color:var(--gold)}.spend-tier span{font-size:11px;color:var(--muted)}.spend-tier.current{border-color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint)}
.card.attention{border-color:#8a6a3a}.card.loan .line{margin:4px 0}
.event-scene img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:3px;margin-bottom:12px;display:block}.event-options{display:grid;gap:8px;margin-top:12px}.event-options .btn{display:grid;gap:2px;justify-items:start;text-align:left;padding:10px 12px;margin-top:0}.event-options .btn small{font-weight:normal;color:var(--muted);font-size:11px;line-height:1.4}
ul.plain{margin:6px 0 0;padding-left:18px;font-size:12px;display:grid;gap:5px}.red{color:var(--red)}
.life-stats span strong[data-live="house-net"]{font-variant-numeric:tabular-nums}

/* People Matter */
.tag{display:inline-block;padding:2px 7px;background:#31413b;color:var(--mint);font:10px var(--mono);border:1px solid #4b5e4b;letter-spacing:.3px;border-radius:2px}
.life-nav{display:grid;gap:8px;margin:14px 0}.life-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.life-group>small{font:10px var(--mono);letter-spacing:1.5px;color:var(--muted);min-width:118px}.life-group .life-tabs{margin:0;flex:1}
.portrait{width:48px;height:60px;display:block;image-rendering:pixelated;background:#1a2a3a;border:1px solid var(--line);border-radius:3px}.portrait.big{width:96px;height:120px}.portrait.tiny{width:24px;height:30px;border-radius:2px}.portrait.sprite-body{background:transparent;border:0}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:8px 0 14px}.person-card{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:4px;color:var(--ink)}.person-card:hover{border-color:var(--mint)}.person-meta{display:grid;gap:3px;min-width:0}.person-meta strong{font-size:13px}.person-meta small{color:var(--muted);font-size:11px}
.profile-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}.profile-head>div{flex:1;min-width:220px}.profile-head .btn{margin-top:0}.profile-actions .btn{flex:0 1 auto}
.interior{margin-top:14px}.interior-scene{position:relative;height:230px;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#101c2b}.int-wall{position:absolute;inset:0 0 34% 0;background:linear-gradient(180deg,color-mix(in srgb,var(--wall) 55%,#101c2b),color-mix(in srgb,var(--wall) 35%,#101c2b))}.int-wall::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:#0b141f}.int-window{position:absolute;left:6%;top:12%;width:16%;height:38%;background:linear-gradient(180deg,#2b4a6b,#12233a);border:3px solid #0b141f;box-shadow:inset 0 0 0 2px #35557a}.int-floor{position:absolute;inset:66% 0 0 0;background:repeating-linear-gradient(90deg,#3b2a1f 0 28px,#33241a 28px 56px)}.int-pieces{position:absolute;left:24%;right:4%;top:8%;height:56%;display:flex;gap:10px;align-items:flex-end;justify-content:space-around}.int-piece{position:relative;height:100%;max-width:23%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.int-piece img{max-height:80%;max-width:100%;object-fit:contain;border:2px solid #0b141f;border-radius:3px;box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 60%,#000)}.int-piece small{font:9px var(--mono);color:#cfd9e2;margin-top:3px;letter-spacing:.5px}.int-empty{align-self:center;color:var(--muted);font-size:12px}
.int-people{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:26px;align-items:flex-end}.sprite{position:relative;width:48px;animation:bob 3.2s ease-in-out infinite}.sprite:nth-child(2){animation-delay:.9s}.sprite:nth-child(3){animation-delay:1.7s}.sprite:nth-child(4){animation-delay:2.4s}.sprite .portrait{width:48px;height:60px}.sprite.child .portrait{width:36px;height:45px}.sprite.infant .portrait{width:28px;height:35px}.sprite.teen .portrait{width:42px;height:52px}.sprite .prop{position:absolute;left:0;top:0;width:100%;height:calc(100% - 14px);image-rendering:pixelated;pointer-events:none}.sprite-name{display:block;text-align:center;font:9px var(--mono);color:#e7d9b8;letter-spacing:.5px;margin-top:2px}.sprite.read .prop,.sprite.draw .prop{animation:page 4s steps(2) infinite}.sprite.cook .prop{animation:stir 1.6s ease-in-out infinite}.sprite.water .prop{animation:pour 2.4s ease-in-out infinite}.sprite.music .prop{animation:strum 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1px)}}@keyframes page{50%{transform:translateX(1px)}}@keyframes stir{50%{transform:rotate(-4deg)}}@keyframes pour{50%{transform:translateY(1px) rotate(-6deg)}}@keyframes strum{50%{transform:translateY(-1px)}}
.int-caption{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:4px 10px;background:#0b141fcc;font:10px var(--mono);letter-spacing:.6px;color:#cfd9e2}.int-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.int-acts .btn{margin-top:0;flex:0 1 auto;font-size:11px}

.memories{display:grid;gap:10px;margin-top:10px}.memory{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:4px}.memory-people{display:flex;gap:3px;flex-wrap:wrap;min-width:54px;max-width:84px}.memory h3{margin:4px 0}
.tree{display:grid;gap:10px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:4px}.tree-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-left:12px;border-left:2px solid var(--line)}.tree-row>small{font:10px var(--mono);letter-spacing:1.5px;color:var(--muted);width:100%}.tree-node{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--raised);border-radius:3px;font-size:12px}.tree-node small{display:block;color:var(--muted);font-size:10px}.tree-node.you{border:1px solid var(--gold)}
.reduce-motion .sprite,.reduce-motion .sprite .prop{animation:none}
@media(prefers-reduced-motion:reduce){.sprite,.sprite .prop{animation:none}}

@media(max-width:650px){.week{grid-template-columns:repeat(2,minmax(0,1fr))}.interior-scene{height:200px}.int-pieces{gap:4px}.int-people{gap:12px}.life-group>small{min-width:0;width:100%}.profile-head{flex-direction:column}}
